---
name: Publish
description: Builds and publishes a Docker image to GitHub Container Registry.

inputs:
  context:
    required: false
    description: Path containing Dockerfile to build. Defaults to repo root
    default: ${{ github.repository }}
  name:
    required: false
    description: Name of the image to push. Defaults to ucl-arc-environments/<repo-name>
    default: ''
  password:
    required: true
    description: Password to use for container registry login.
  registry:
    required: false
    description: Container registry to push to. Defaults to ghcr.io
    default: ghcr.io
  target:
    required: false
    description: Docker image target. See https://docs.docker.com/build/building/multi-stage/
    default: ''

runs:
  using: composite
  steps:
    - name: Free additional disk space
      shell: bash
      run: rm -rf /opt/hostedtoolcache

    - name: Checkout repository
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

    - name: Login to the container registry
      uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.password }}

    - name: Extract tags and labels for Docker
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
      with:
        images: ${{ inputs.registry }}/${{ inputs.name }}

    - name: Build and push Docker image
      uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
      with:
        context: ${{ inputs.context }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        target: ${{ inputs.target }}
