---
name: terraform-docs
description: Runs terraform-docs

inputs:
  find-dir:
    description: The directory to start searching for Terraform modules
    required: false
    default: '.'
  working-dir:
    description: The working directory to run terraform-docs in
    required: false
    default: '.'
  recursive:
    description: Whether to search for Terraform modules recursively
    required: false
    default: 'false'
  github-app-id:
    description: The GitHub App ID for authentication
    required: false
    default: ''
  github-app-private-key:
    description: The GitHub App private key for authentication
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        if [[ "${{ inputs.find-dir }}" != ""  && "${{ inputs.working-dir }}" != "" ]]; then
          echo "Error: don't provide both find-dir and working-dir inputs."
          exit 1
        fi

        if [[ "${{ inputs.find-dir }}" == ""  && "${{ inputs.working-dir }}" == "" ]]; then
          echo "Error: you must provide either find-dir or working-dir inputs."
          exit 1
        fi

        if [[ "${{ inputs.github-app-id }}" != ""  && "${{ inputs.github-app-private-key }}" == "" ]]; then
          echo "Error: if using a Github App ID, you must also provide a private key."
          exit 1
        fi

        if [[ "${{ inputs.github-app-id }}" == ""  && "${{ inputs.github-app-private-key }}" != "" ]]; then
          echo "Error: if providing a private key, you must also provide a Github App ID."
          exit 1
        fi

    - name: Generate token
      id: generate-token
      # yamllint disable-line rule:line-length
      uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2
      with:
        app-id: ${{ inputs.github-app-id }}
        private-key: ${{ inputs.github-app-private-key }}
      if: inputs.github-app-id != '' && inputs.github-app-private-key != ''

    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      with:
        ref: ${{ github.event.pull_request.head.ref }}
      if: inputs.github-app-id == '' && inputs.github-app-private-key == ''

    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        token: ${{ steps.generate-token.outputs.token }}
      if: inputs.github-app-id != '' && inputs.github-app-private-key != ''

    - name: Render terraform docs and push changes back to PR
      uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1
      with:
        find-dir: ${{ inputs.find-dir }}
        git-push: true
        output-method: inject
      if: inputs.find-dir != ''

    - name: Render terraform docs and push changes back to PR
      uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1
      with:
        working-dir: ${{ inputs.working-dir }}
        git-push: true
        output-method: inject
      if: inputs.working-dir != ''

    - name: Render terraform docs and push changes back to PR
      uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1
      with:
        working-dir: ${{ inputs.working-dir }}
        git-push: true
        output-method: inject
        recursive: true
      if: inputs.working-dir != '' && inputs.recursive == 'true'
